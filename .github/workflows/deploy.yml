name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e atualizar servidor na AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Acede à pasta do projeto e força a versão exata do GitHub
            cd /home/ubuntu/safenav
            git fetch --all
            git reset --hard origin/main
            
            # Reinicia o Nginx e encerra o processo antigo do Gunicorn
            sudo systemctl restart nginx
            sudo pkill -f gunicorn || true
            
            # Ativa o ambiente virtual e injeta a chave secreta de segurança
            source venv/bin/activate
            export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"
            
            # Inicia o Gunicorn com redirecionamento total de canais para não prender a sessão SSH
            nohup gunicorn --bind 127.0.0.1:8000 safenav_project.wsgi:application --daemon </dev/null >/dev/null 2>&1 &
            
            # Informa o GitHub Actions que o script concluiu com sucesso, forçando o fecho da ligação
            exit 0