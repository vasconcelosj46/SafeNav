name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e atualizar servidor na AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Acede à pasta do projeto e força a versão exata do GitHub
            cd /home/ubuntu/safenav
            git fetch --all
            git reset --hard origin/main

            # Reinicia o Nginx
            sudo systemctl restart nginx

            # Encerra o Gunicorn antigo liberando a porta 8000.
            # Atenção: NÃO usar 'pkill -f gunicorn' aqui. O -f casa com a linha de comando
            # da própria sessão SSH do deploy (que contém a palavra "gunicorn") e a derruba.
            sudo fuser -k 8000/tcp || sudo pkill -x gunicorn || true
            sleep 2

            # Ativa o ambiente virtual e injeta a chave secreta de segurança
            source venv/bin/activate
            export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"

            # Inicia o Gunicorn com redirecionamento total de canais para não prender a sessão SSH
            nohup gunicorn --bind 127.0.0.1:8000 safenav_project.wsgi:application --daemon </dev/null >/dev/null 2>&1 &

            # Confere se a aplicação respondeu; se não, o deploy falha de forma visível
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && echo "Gunicorn OK"