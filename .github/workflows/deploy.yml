name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e atualizar servidor na AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Acessa a pasta do projeto
            cd /home/ubuntu/safenav
            
            # Força o servidor a descarregar a versão exata do GitHub
            git fetch --all
            git reset --hard origin/main
            
            # Reinicia o Nginx
            sudo systemctl restart nginx
            
            # Força o encerramento do Gunicorn antigo
            sudo pkill -f gunicorn || true
            
            # Ativa o ambiente virtual e injeta a chave de segurança
            source venv/bin/activate
            export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"
            
            # Inicia a versão nova totalmente desvinculada da sessão SSH
            nohup gunicorn --bind 127.0.0.1:8000 safenav_project.wsgi:application > /dev/null 2>&1 &