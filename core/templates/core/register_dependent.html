<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Dependente - SafeKids</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900 flex flex-col min-h-screen">
  
  <nav class="bg-blue-950 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="font-bold text-xl flex items-center space-x-2">
          <span>🛡️ SafeKids Dashboard</span>
        </div>
        <div>
          <a href="{% url 'dashboard' %}" class="text-sm text-blue-200 hover:text-white transition font-semibold">
            ⬅ Voltar ao Painel
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">👤</div>
        <h2 class="text-2xl font-bold text-slate-800">Cadastrar Dependente</h2>
        <p class="text-sm text-slate-500 mt-1">Um token de monitoramento será gerado automaticamente.</p>
      </div>
      
      <form method="POST" action="{% url 'register_dependent' %}" class="space-y-5">
        {% csrf_token %}
        
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Nome do Filho(a)
          </label>
          <!-- O Django renderiza o campo de input aqui -->
          {{ form.name }}
          
          {% if form.name.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.name.errors|striptags }}</p>
          {% endif %}
        </div>

        <div class="pt-2">
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition w-full shadow-sm">
            Salvar e Gerar Token
          </button>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
