<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar 2FA - SafeNav</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Segurança da Conta</h2>
    <p class="text-sm text-slate-600 mb-6">Escaneie o QR Code abaixo com o Google Authenticator ou Authy para ativar a Verificação em Duas Etapas.</p>
    
    <div class="flex justify-center mb-6">
      <div class="p-4 bg-white border border-slate-200 rounded-xl inline-block">
        <!-- Renderiza a imagem gerada pelo Python -->
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code 2FA" class="w-48 h-48">
      </div>
    </div>

    <p class="text-xs text-red-600 font-medium mb-6">Atenção: A partir de agora, os 6 dígitos serão obrigatórios a cada login.</p>
    
    <a href="{% url 'dashboard' %}" class="w-full inline-block bg-blue-900 hover:bg-blue-950 text-white font-semibold py-3 rounded-lg shadow-md transition">
      Voltar para o Dashboard
    </a>
  </div>
</body>
</html>
